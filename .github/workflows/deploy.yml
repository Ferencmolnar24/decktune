name: Build and deploy

on:
  push:
    branches: [main]
  # A new, edited, closed or relabelled report goes live with the next build.
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  # Daily: pick up new Steam releases and fresh ProtonDB / Deck Verified ratings.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect community reports
        run: npm run data:reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh Steam data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          npm run data:catalog
          npm run data:facts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json public/data/facts.json
          git diff --cached --quiet || (git commit -m "Refresh Steam data" && git push)

      # Supabase pauses a free project after a week without use; a daily read keeps it awake.
      - name: Keep the report database awake
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          set -a; . ./.env; set +a
          if [ -n "$VITE_SUPABASE_URL" ]; then
            curl -fsS -o /dev/null "$VITE_SUPABASE_URL/rest/v1/reports?select=id&limit=1" -H "apikey: $VITE_SUPABASE_KEY"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
