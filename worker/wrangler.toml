# DeckTune's report service on Cloudflare Workers (free plan). Setup steps are in ../README.md.
name = "decktune-reports"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# The repository reports are filed in, and the site allowed to post.
REPO = "Ferencmolnar24/decktune"
ALLOWED_ORIGINS = "https://ferencmolnar24.github.io"

# At most 3 reports a minute from one visitor.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

# Secrets, set with `npx wrangler secret put <NAME>`, never written here:
#   GITHUB_TOKEN      fine-grained token: this repository only, Issues read and write
#   TURNSTILE_SECRET  optional, turns on Cloudflare's bot check
